<!DOCTYPE html>
<html lang="pt-BR">


    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}">
        <title>Editar Produto</title>
    </head>

    <body>
        
        <div class="caixa">

            <h1>Editar Produto</h1>

            <form action="/atualizar/{{produto['id']}}" method="POST">

                <label>Nome:</label><br>
                <input type="text" name="nome" value="{{ produto['nome']}}" required><br>

                <label>Quantidade:</label><br>
                <input type="text" name="quantidade" value="{{produto['quantidade']}}" required><br>

                <label>Preço:</label><br>
                <input type="number" step="0.01" name="preco" value="{{produto['preco']}}" required><br>

                <button type="submit">SALVAR ALTERAÇÕES</button>

            </form>

        </div>

    </body>

</html>
