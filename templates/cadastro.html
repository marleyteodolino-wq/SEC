
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <title>Cadastrar Produto | S.EC</title>
</head>

<body>

    <main class="login-container">

        <header class="login-header">
            <div class="logo-sic">S<span>.</span>EC</div>
            <p>Sistema Eficiente de Cadastro</p>
        </header>

        <section class="caixa">

            <div class="login-titulo">
                <h1>CADASTRAR PRODUTO</h1>
                <p>Adicione um produto ao seu estoque</p>
                <div class="linha-azul"></div>
            </div>

            <form action="/cadastrar" method="POST">

                <div class="campo">
                    <label for="nome">Nome do produto</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite o nome do produto"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="quantidade">Quantidade</label>
                    <input
                        type="number"
                        id="quantidade"
                        name="quantidade"
                        placeholder="Digite a quantidade"
                        min="0"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="preco">Preço (R$)</label>
                    <input
                        type="number"
                        id="preco"
                        name="preco"
                        placeholder="0,00"
                        min="0"
                        step="0.01"
                        required
                    >
                </div>

                <button type="submit">
                    CADASTRAR PRODUTO <span>→</span>
                </button>

            </form>

            <div class="cadastro-link">
                <a href="{{ url_for('inicio') }}">Voltar ao início</a>
            </div>

            <footer class="login-footer">
                Sistema de gestão • S.EC
            </footer>

        </section>

    </main>

</body>
</html>
