
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <title>Cadastro | S.EC</title>
</head>

<body>

    <main class="login-container">

        <header class="login-header">
            <div class="logo-sic">S<span>.</span>EC</div>
            <p>Sistema Eficiente de Cadastro</p>
        </header>

        <section class="caixa">

            <div class="login-titulo">
                <h1>CRIAR CONTA</h1>
                <p>Cadastre-se para começar!</p>
                <div class="linha-azul"></div>
            </div>

            <form action="/cadastrar_usuario" method="POST">

                <div class="campo">
                    <label for="nome">Nome completo</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        autocomplete="email"
                        required
                    >
                </div>

                
                <div class="campo">
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Crie uma senha forte"
                        autocomplete="new-password"
                        minlength="8"
                        pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,}"
                        title="Use pelo menos 8 caracteres, incluindo maiúscula, minúscula, número e caractere especial."
                        required
                    >
                </div>

                <div class="campo">
                    <label for="confirmar_senha">Confirmar senha</label>
                    <input
                        type="password"
                        id="confirmar_senha"
                        name="confirmar_senha"
                        placeholder="Digite a senha novamente"
                        autocomplete="new-password"
                        required
                    >
                </div>


                <button type="submit">
                    CRIAR CONTA <span>→</span>
                </button>

            </form>

            <div class="cadastro-link">
                <span>Já tem uma conta?</span>
                <a href="{{ url_for('login') }}">Entrar</a>
            </div>

            <footer class="login-footer">
                Sistema de gestão • S.IC
            </footer>

        </section>

    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

    <script>
    const formulario = document.querySelector("form");
    const senha = document.getElementById("senha");
    const confirmarSenha = document.getElementById("confirmar_senha");

    function validarConfirmacao() {
        if (confirmarSenha.value !== senha.value) {
            confirmarSenha.setCustomValidity("As senhas não coincidem.");
        } else {
            confirmarSenha.setCustomValidity("");
        }
    }

    senha.addEventListener("input", validarConfirmacao);
    confirmarSenha.addEventListener("input", validarConfirmacao);

    formulario.addEventListener("submit", function (event) {
        validarConfirmacao();

        if (!formulario.checkValidity()) {
            event.preventDefault();
            formulario.reportValidity();
        }
    });
</script>

</body>
</html>
